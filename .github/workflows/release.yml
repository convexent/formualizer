name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify tag versions match manifests
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          python - "${VERSION}" <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          repo = Path(".")
          tag_version = sys.argv[1]

          def toml_version(path: Path, keys: list[str]) -> str:
            data = tomllib.loads(path.read_text(encoding="utf-8"))
            cur = data
            for k in keys:
              cur = cur[k]
            return str(cur)

          def json_version(path: Path) -> str:
            data = json.loads(path.read_text(encoding="utf-8"))
            return str(data["version"])

          checks = [
            ("crates/formualizer/Cargo.toml", lambda p: toml_version(p, ["package", "version"])),
            ("bindings/python/pyproject.toml", lambda p: toml_version(p, ["project", "version"])),
            ("bindings/wasm/package.json", json_version),
          ]

          failures: list[str] = []
          for rel, reader in checks:
            path = repo / rel
            actual = reader(path)
            if actual != tag_version:
              failures.append(f"{rel}: {actual} != {tag_version}")

          if failures:
            print("Tag/version mismatch:\n" + "\n".join(failures))
            raise SystemExit(1)

          print(f"OK: v{tag_version} matches product manifests")
          PY

  build-wheels:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: bindings/python
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist

  build-sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist

  github-release:
    needs:
      - build-wheels
      - build-sdist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          files: dist/*
