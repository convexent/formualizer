name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify tag versions match manifests
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          python - "${VERSION}" <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          repo = Path(".")
          tag_version = sys.argv[1]

          def toml_version(path: Path, keys: list[str]) -> str:
            data = tomllib.loads(path.read_text(encoding="utf-8"))
            cur = data
            for k in keys:
              cur = cur[k]
            return str(cur)

          def json_version(path: Path) -> str:
            data = json.loads(path.read_text(encoding="utf-8"))
            return str(data["version"])

          checks = [
            ("crates/formualizer/Cargo.toml", lambda p: toml_version(p, ["package", "version"])),
            ("bindings/python/pyproject.toml", lambda p: toml_version(p, ["project", "version"])),
            ("bindings/wasm/package.json", json_version),
          ]

          failures: list[str] = []
          for rel, reader in checks:
            path = repo / rel
            actual = reader(path)
            if actual != tag_version:
              failures.append(f"{rel}: {actual} != {tag_version}")

          if failures:
            print("Tag/version mismatch:\n" + "\n".join(failures))
            raise SystemExit(1)

          print(f"OK: v{tag_version} matches product manifests")
          PY

  build-wheels-linux:
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml --interpreter python3.12
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  build-wheels-macos:
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  build-sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path bindings/python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  github-release:
    needs:
      - build-wheels-linux
      - build-wheels-macos
      - build-sdist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          files: dist/*
